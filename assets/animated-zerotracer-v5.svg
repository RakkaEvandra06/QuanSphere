<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .headline { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 72px; font-weight: bold; fill: #ffffff; }
      .subhead { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 20px; fill: #cccccc; }
      .small { font-family: 'Helvetica', 'Arial', sans-serif; font-size: 12px; fill: #666666; }
      .line { stroke: #ffffff; stroke-width: 1; fill: none; }
      .line-thin { stroke: #ffffff; stroke-width: 0.5; fill: none; }
    </style>
  </defs>

  <!-- Background gelap -->
  <rect width="800" height="400" fill="#0a0a0a" />

  <!-- Garis latar belakang bergerak (efek aliran data) -->
  <g opacity="0.15">
    <line x1="0" y1="40" x2="800" y2="40" class="line-thin" />
    <animateTransform attributeName="transform" type="translate" from="-800 0" to="800 0" dur="25s" repeatCount="indefinite" />
  </g>
  <g opacity="0.15">
    <line x1="0" y1="80" x2="800" y2="80" class="line-thin" />
    <animateTransform attributeName="transform" type="translate" from="-800 0" to="800 0" dur="20s" repeatCount="indefinite" />
  </g>
  <g opacity="0.15">
    <line x1="0" y1="120" x2="800" y2="120" class="line-thin" />
    <animateTransform attributeName="transform" type="translate" from="-800 0" to="800 0" dur="30s" repeatCount="indefinite" />
  </g>
  <g opacity="0.15">
    <line x1="0" y1="280" x2="800" y2="280" class="line-thin" />
    <animateTransform attributeName="transform" type="translate" from="-800 0" to="800 0" dur="18s" repeatCount="indefinite" />
  </g>
  <g opacity="0.15">
    <line x1="0" y1="320" x2="800" y2="320" class="line-thin" />
    <animateTransform attributeName="transform" type="translate" from="-800 0" to="800 0" dur="22s" repeatCount="indefinite" />
  </g>
  <g opacity="0.15">
    <line x1="0" y1="360" x2="800" y2="360" class="line-thin" />
    <animateTransform attributeName="transform" type="translate" from="-800 0" to="800 0" dur="28s" repeatCount="indefinite" />
  </g>

  <!-- Garis vertikal latar belakang -->
  <g opacity="0.1">
    <line x1="100" y1="0" x2="100" y2="400" class="line-thin" />
    <animateTransform attributeName="transform" type="translate" from="0 -400" to="0 400" dur="30s" repeatCount="indefinite" />
  </g>
  <g opacity="0.1">
    <line x1="700" y1="0" x2="700" y2="400" class="line-thin" />
    <animateTransform attributeName="transform" type="translate" from="0 -400" to="0 400" dur="25s" repeatCount="indefinite" />
  </g>

  <!-- Dekorasi kiri: persegi berputar -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 120 200" to="360 120 200" dur="12s" repeatCount="indefinite" />
    <rect x="80" y="160" width="80" height="80" fill="none" stroke="#ffffff" stroke-width="2" />
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 120 200" to="-360 120 200" dur="15s" repeatCount="indefinite" />
    <rect x="90" y="170" width="60" height="60" fill="none" stroke="#aaaaaa" stroke-width="2" />
  </g>

  <!-- Dekorasi kanan: persegi berputar -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 680 200" to="360 680 200" dur="14s" repeatCount="indefinite" />
    <rect x="640" y="160" width="80" height="80" fill="none" stroke="#ffffff" stroke-width="2" />
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 680 200" to="-360 680 200" dur="18s" repeatCount="indefinite" />
    <rect x="650" y="170" width="60" height="60" fill="none" stroke="#aaaaaa" stroke-width="2" />
  </g>

  <!-- Garis aksen atas dan bawah -->
  <line x1="100" y1="60" x2="700" y2="60" class="line" opacity="0.3" />
  <line x1="100" y1="340" x2="700" y2="340" class="line" opacity="0.3" />

  <!-- Headline ZeroTrace dengan fade-in & slide-up -->
  <text x="400" y="180" class="headline" text-anchor="middle" opacity="0">
    ZeroTrace
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.5s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="0 30" to="0 0" dur="1s" begin="0.5s" fill="freeze" />
  </text>

  <!-- Garis bawah yang berdenyut (memanjang & menyempit) -->
  <rect x="300" y="210" height="2" fill="#ffffff">
    <animate attributeName="width" values="0;200;200;0" keyTimes="0;0.3;0.7;1" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Sub-headline dengan fade-in & slide-up -->
  <text x="400" y="250" class="subhead" text-anchor="middle" opacity="0">
    Secure File Protection &amp; Hybrid Encryption
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="1s" begin="2s" fill="freeze" />
  </text>

  <!-- Footer -->
  <text x="400" y="370" class="small" text-anchor="middle" opacity="0.5">ZeroTrace Security &bull; 2026</text>
</svg>